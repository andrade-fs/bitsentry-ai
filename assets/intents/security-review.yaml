id: security-review
description: Security/AppSec/threat and risk review without autonomous pentest runtime.
default_decision: use_flow_source-security-review
default_flow: source-security-review
alternative_flow: web-assessment
complexity_threshold: medium
pre_flow_roles:
  - security-reviewer
  - appsec-reviewer
  - threat-modeler
pre_flow_skills:
  - security/security-init
  - security/security-scope
  - security/security-map
expected_context_outputs:
  - threat_model
  - risk_register
  - mitigations
direct_answer_allowed: true
requires_confirmation: true
requires_bounded_discovery: true
forbidden_actions:
  - claim_pentest_execution
  - edit_without_permission

flow_selection_notes:
  - "Keep source-security-review as default for source code/repository/read-only security review."
  - "Use web-assessment only for explicit live target signals (URL/domain/public web/curl/httpx/nuclei/browser/testing against authorized external target)."
  - "The phrase 'revisión de seguridad del repo' must remain mapped to source-security-review, not web-assessment."
